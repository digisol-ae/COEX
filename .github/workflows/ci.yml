name: CI

# Runs on every push and every pull request, so a broken change announces itself before anyone
# reads the diff. The database tests are deliberately not here: they need credentials for a real
# MongoDB, and putting an Atlas connection string into a runner that anyone can trigger is a worse
# risk than running those tests locally before a release.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src --max-warnings=0

      - name: Format
        run: npx prettier --check "src/**/*.{ts,tsx,css}" "tests/**/*.ts"

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          # The build only needs the variable to exist; nothing connects during a build.
          MONGODB_URI: mongodb://localhost:27017/coex_build
