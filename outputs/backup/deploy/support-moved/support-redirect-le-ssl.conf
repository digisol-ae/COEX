<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName support.digisolteam.com
    # Old osTicket portal moved to Worktello: every path shows the "we've moved" page.
    DocumentRoot /var/www/support-moved
    <Directory /var/www/support-moved>
        Require all granted
        Options -Indexes
    </Directory>
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{REQUEST_URI} !^/index\.html$
    RewriteRule ^ /index.html [L]
    ErrorLog ${APACHE_LOG_DIR}/support-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/support-redirect-access.log combined
SSLCertificateFile /etc/letsencrypt/live/support.digisolteam.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/support.digisolteam.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
