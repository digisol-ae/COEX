<VirtualHost *:80>
    ServerName worktello.com
    ServerAlias www.worktello.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3002/
    ProxyPassReverse / http://127.0.0.1:3002/

    ErrorLog ${APACHE_LOG_DIR}/worktello-error.log
    CustomLog ${APACHE_LOG_DIR}/worktello-access.log combined
</VirtualHost>
