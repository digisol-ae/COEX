<VirtualHost *:80>
    ServerName support.digisolteam.com
    # Old osTicket portal moved to Worktello.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://worktello.com/login [R=301,L]
    ErrorLog ${APACHE_LOG_DIR}/support-redirect-error.log
    CustomLog ${APACHE_LOG_DIR}/support-redirect-access.log combined
</VirtualHost>
