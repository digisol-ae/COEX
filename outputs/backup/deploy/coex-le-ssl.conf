<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName coex.digisol.ae

    # Moved to worktello.com. Teams/Outlook/Copilot integration paths stay served here until
    # every client has the Worktello 1.4.0 package and Copilot is re-registered.
    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/(api|integrations|_next)/
    RewriteRule ^ https://worktello.com%{REQUEST_URI} [END,NE,R=301]

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/coex-error.log
    CustomLog ${APACHE_LOG_DIR}/coex-access.log combined
SSLCertificateFile /etc/letsencrypt/live/coex.digisol.ae/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/coex.digisol.ae/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
