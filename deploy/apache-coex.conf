# COEX behind the Apache that already serves Zabbix on this machine.
#
# A second virtual host beside the Zabbix one. Apache decides by the name in the request, so the
# two never collide and nothing about the Zabbix site changes. COEX itself listens only on
# 127.0.0.1:3100 and is never reachable from outside except through here.
#
#   sudo a2enmod proxy proxy_http headers
#   sudo cp deploy/apache-coex.conf /etc/apache2/sites-available/coex.conf
#   sudo a2ensite coex
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d coex.digisol.ae
#
# certbot adds the port 443 virtual host and the redirect. Reload rather than restart, so the
# Zabbix site is never even briefly down.

<VirtualHost *:80>
    ServerName coex.digisol.ae

    ProxyPreserveHost On
    ProxyRequests Off

    # The trailing slashes on both sides matter. Without them Apache mangles paths that contain
    # encoded characters, which breaks the attachment download links.
    ProxyPass / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    # Next.js reads this to build absolute URLs. certbot rewrites it to https for the 443 host.
    RequestHeader set X-Forwarded-Proto "http"

    # A ticket attachment can be large, and the app enforces its own 25MB limit per file. This sits
    # a little above it so the app gives the real error rather than Apache cutting the upload off.
    LimitRequestBody 31457280

    ErrorLog ${APACHE_LOG_DIR}/coex-error.log
    CustomLog ${APACHE_LOG_DIR}/coex-access.log combined
</VirtualHost>
