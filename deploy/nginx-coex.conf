# COEX behind Nginx.
#
# Only use this if Nginx is what already serves this machine. If something else holds ports 80 and
# 443, add COEX to that instead: the shape is always the same, a name that proxies to
# 127.0.0.1:3100 with the client's real address passed along.
#
#   sudo cp deploy/nginx-coex.conf /etc/nginx/sites-available/coex
#   sudo ln -s /etc/nginx/sites-available/coex /etc/nginx/sites-enabled/coex
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d coex.digisol.ae
#
# certbot rewrites this file to add the certificate and the redirect from port 80.

server {
    listen 80;
    listen [::]:80;

    server_name coex.digisol.ae;

    # A ticket attachment can be large, and the app enforces its own limit of 25MB per file. This
    # is a little above that so the app gets to give the real error rather than Nginx cutting the
    # upload off with a page nobody can read.
    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Next.js fingerprints these filenames, so they can be cached hard and forever.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
